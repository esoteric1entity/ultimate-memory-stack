name: Feature request
description: Suggest a new feature, addon, or improvement to UMS
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing problem. We start with the "why," not the "how."
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Where does this fit?
      options:
        - Core protocol (MEMORY_PROTOCOL.md)
        - Schema (SCHEMA_A18 / A3 / audit_log / quarantine / etc.)
        - Compliance preset / EXTENSIONS
        - Install / setup flow
        - A specific Skill (install-ultimate-memory-stack / audit-quarantine / openclaw-adapter)
        - A specific addon (graphify / graphiti / llmlingua / obsidian-vault-config)
        - New addon
        - Edition-specific (biotech vs general)
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should UMS handle this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs you ruled out, or existing features this would replace.

  - type: checkboxes
    id: scope-confirm
    attributes:
      label: Scope confirmation
      description: UMS is opinionated about what it ships. See `common-specs/MODULARITY.md` for the brand-protected boundary.
      options:
        - label: I've read `MODULARITY.md` and this feature respects the brand-protected boundary (or this is a proposal to change that boundary, in which case I'll explain why)
          required: true
