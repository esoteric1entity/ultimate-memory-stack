name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Addon manifest resolve gate.
  #
  # v4.0.0 shipped two of three addon manifests UNINSTALLABLE — graphify pinned
  # `tree-sitter<0.22.0` while graphifyy 0.8.21 requires `>=0.23.0`
  # (ResolutionImpossible on every platform), and llmlingua pinned
  # `torch<2.3.0`, which has no distribution at all on Python 3.13. Neither was
  # caught because NOTHING in the repo ever executed a requirements.txt: the
  # install jobs below only register skills, and the only repo-wide mention of
  # the file outside the manifests was a print() in a smoke test.
  #
  # This job is the fix for the CLASS, not the instances. A manifest that
  # cannot resolve now fails CI before it can reach a user.
  #
  # --dry-run: resolution only. Nothing is installed, no environment mutated.
  # --------------------------------------------------------------------------
  addon-manifests:
    name: addon manifests resolve (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor is the lowest version any addon declares support for
        # (graphifyy and graphiti-core both require_python >= 3.10).
        python: ["3.10", "3.11", "3.12", "3.13"]
        # macOS included deliberately: the install jobs below exercise macOS
        # but `verify.sh` never runs pip at all, so without this row no job
        # anywhere would ever resolve an addon manifest on macOS — and wheel
        # availability is exactly the kind of thing that differs per platform
        # (FalkorDB Lite ships macOS wheels but no Windows ones).
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Verify hash-pinned lockfiles install
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          rc=0
          PYV="${{ matrix.python }}"
          for lock in recommended-addons/*/locks/requirements-py${PYV}.lock; do
            echo "==== $lock ===="
            # --require-hashes makes pip refuse any artifact whose hash is not
            # listed, so a substituted or tampered distribution fails closed.
            if python -m pip install --dry-run --quiet --require-hashes --report - -r "$lock" >/dev/null; then
              echo "  OK (hash-verified)"
            else
              echo "  FAILED: $lock"
              python -m pip install --dry-run --require-hashes -r "$lock" 2>&1 | tail -20 || true
              rc=1
            fi
          done
          exit $rc

      # Backend integrity. Resolving a manifest proves it INSTALLS; it does not
      # prove the result can still do its job. `uv pip compile` succeeds happily
      # on a manifest whose backend has quietly dropped out, and pip installs a
      # package without an extra it no longer provides — exit 0, no warning.
      #
      # So this asks two questions resolution cannot: does every lock still pin
      # the backends its add-on exists to install, and does the pinned
      # graphiti-core release still declare the `kuzu` extra? The second is the
      # machine-readable signal that Kuzu driver support is being withdrawn —
      # Kuzu upstream is archived (see graphiti-installer/requirements.txt), and
      # we deliberately do NOT ceiling graphiti-core, so this is the tripwire.
      #
      # --probe-upstream needs the network, which this job already requires. An
      # unreachable PyPI reports UNVERIFIED and does NOT fail: a blocked host is
      # not evidence that upstream removed anything.
      #
      # Runs on ubuntu/py3.13 only — it inspects committed lockfiles, so it is
      # platform- and interpreter-independent, and one probe is enough. Running
      # it on all 12 matrix legs would be 12 identical PyPI queries.
      - name: Backend integrity (locks pin their backends; upstream still offers them)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python recommended-addons/regenerate-locks.py --check --probe-upstream

      - name: Resolve every addon manifest
        shell: bash
        env:
          # PyPI metadata contains non-ASCII (a ⭐ in one summary was enough to
          # kill a local run with UnicodeEncodeError under cp1252). Windows
          # runners hit the same path — same defect class the shipped scripts
          # already guard against.
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          rc=0
          for req in recommended-addons/*/requirements.txt; do
            echo "==== $req ===="
            if python -m pip install --dry-run --quiet --report - -r "$req" >/dev/null; then
              echo "  OK"
            else
              echo "  FAILED to resolve: $req"
              python -m pip install --dry-run -r "$req" 2>&1 | tail -20 || true
              rc=1
            fi
          done
          exit $rc

  unit-tests:
    name: unit tests (pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is REQUIRED here, not decorative: the addon payload
        # parity test exercises setup-memory-stack.ps1, which no other job
        # inspects (verify.sh only counts skills, it never checks payload).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: the migration suite builds a v3.6.2 fixture
          # via `git archive 59541b9` (tests/conftest.py). The default shallow
          # clone lacks that baseline commit and every migration test errors at
          # setup — do not lower this back to a shallow fetch.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit suite
        run: python -m pytest tests/ -q

  install-bash:
    name: install + verify (bash, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (default — all addons, general-edition)
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-test
        run: |
          mkdir -p "$WORKING_DIR"
          cd "$WORKING_DIR"
          bash "${{ github.workspace }}/setup-memory-stack.sh" --skip-wizard --compliance=none

      - name: Verify install
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-test
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"

  install-minimal:
    name: install --minimal (bash, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal (no addons)
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-minimal
        run: |
          mkdir -p "$WORKING_DIR"
          cd "$WORKING_DIR"
          bash "${{ github.workspace }}/setup-memory-stack.sh" --minimal --skip-wizard --compliance=none

      - name: Verify install
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-minimal
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"

  install-windows:
    name: install + verify (powershell, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (PowerShell, all addons)
        shell: pwsh
        env:
          WORKING_DIR: ${{ runner.temp }}\ums-test-win
        run: |
          New-Item -ItemType Directory -Force -Path $env:WORKING_DIR | Out-Null
          Set-Location $env:WORKING_DIR
          & "$env:GITHUB_WORKSPACE\setup-memory-stack.ps1" -SkipWizard -Compliance none

      - name: Verify install (via bash since verify.sh is bash-only)
        shell: bash
        env:
          WORKING_DIR: ${{ runner.temp }}\ums-test-win
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"
