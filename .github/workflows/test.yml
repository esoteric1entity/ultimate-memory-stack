name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, because the things most likely to break this package do not happen
  # when we push — they happen upstream while we are not looking. A pinned
  # release gets yanked, a backend stops declaring the extra its driver needs,
  # a dependency goes a year without a release. Push-triggered CI cannot see any
  # of that; it only re-runs when WE change something.
  #
  # The upstream probe fails open on an unreachable PyPI, so a weekly run cannot
  # turn a network blip into a red repo — it can only surface a real change.
  #
  # Sunday 06:17 UTC: deliberately off the hour. GitHub's scheduler queues a
  # thundering herd at :00 and drops runs under load.
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Addon manifest resolve gate.
  #
  # v4.0.0 shipped two of three addon manifests UNINSTALLABLE — graphify pinned
  # `tree-sitter<0.22.0` while graphifyy 0.8.21 requires `>=0.23.0`
  # (ResolutionImpossible on every platform), and llmlingua pinned
  # `torch<2.3.0`, which has no distribution at all on Python 3.13. Neither was
  # caught because NOTHING in the repo ever executed a requirements.txt: the
  # install jobs below only register skills, and the only repo-wide mention of
  # the file outside the manifests was a print() in a smoke test.
  #
  # This job is the fix for the CLASS, not the instances. A manifest that
  # cannot resolve now fails CI before it can reach a user.
  #
  # --dry-run: resolution only. Nothing is installed, no environment mutated.
  # --------------------------------------------------------------------------
  addon-manifests:
    name: addon manifests resolve (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This job talks to PyPI on every leg. GitHub's default job timeout is 6
    # HOURS, so one hung index call would burn a runner for a whole afternoon
    # and hold the queue. Nothing here legitimately takes more than a couple of
    # minutes: a resolve that runs 15 is stuck, not slow.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Floor is the lowest version any addon declares support for
        # (graphifyy and graphiti-core both require_python >= 3.10).
        python: ["3.10", "3.11", "3.12", "3.13"]
        # macOS included deliberately: the install jobs below exercise macOS
        # but `verify.sh` never runs pip at all, so without this row no job
        # anywhere would ever resolve an addon manifest on macOS — and wheel
        # availability is exactly the kind of thing that differs per platform
        # (FalkorDB Lite ships macOS wheels but no Windows ones).
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Verify hash-pinned lockfiles install
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          rc=0
          PYV="${{ matrix.python }}"
          for lock in recommended-addons/*/locks/requirements-py${PYV}.lock; do
            echo "==== $lock ===="
            # What this PROVES: the lock resolves, and every requirement in it
            # carries a hash (--require-hashes refuses a hash-less line). What
            # it does NOT prove: that the digests are CORRECT — under --dry-run
            # pip resolves from PEP 658 metadata and never downloads an
            # artifact, so a corrupted digest passes. Negative-controlled
            # 2026-08-24 (pip 25.3, cold cache, --no-cache-dir): a lock with
            # its first sha256 deliberately flipped exited 0 from this exact
            # command. Digest enforcement lives where installs are real — the
            # addon-smoke job below (graphify + graphiti) and every user
            # install, where a wrong digest fails CLOSED: a loud install
            # failure, not a silent substitution.
            if python -m pip install --dry-run --quiet --require-hashes --report - -r "$lock" >/dev/null; then
              echo "  OK (resolves; hashes present)"
            else
              echo "  FAILED: $lock"
              python -m pip install --dry-run --require-hashes -r "$lock" 2>&1 | tail -20 || true
              rc=1
            fi
          done
          exit $rc

      # Backend integrity. Resolving a manifest proves it INSTALLS; it does not
      # prove the result can still do its job. `uv pip compile` succeeds happily
      # on a manifest whose backend has quietly dropped out, and pip installs a
      # package without an extra it no longer provides — exit 0, no warning.
      #
      # So this asks two questions resolution cannot: does every lock still pin
      # the backends its add-on exists to install, and does the pinned
      # graphiti-core release still declare the `kuzu` extra? The second is the
      # machine-readable signal that Kuzu driver support is being withdrawn —
      # Kuzu upstream is archived (see graphiti-installer/requirements.txt), and
      # we deliberately do NOT ceiling graphiti-core, so this is the tripwire.
      #
      # --probe-upstream needs the network, which this job already requires. An
      # unreachable PyPI reports UNVERIFIED and does NOT fail: a blocked host is
      # not evidence that upstream removed anything.
      #
      # Runs on ubuntu/py3.13 only — it inspects committed lockfiles, so it is
      # platform- and interpreter-independent, and one probe is enough. Running
      # it on all 12 matrix legs would be 12 identical PyPI queries.
      - name: Backend integrity (locks pin their backends; upstream still offers them)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python recommended-addons/regenerate-locks.py --check --probe-upstream

      - name: Resolve every addon manifest
        shell: bash
        env:
          # PyPI metadata contains non-ASCII (a ⭐ in one summary was enough to
          # kill a local run with UnicodeEncodeError under cp1252). Windows
          # runners hit the same path — same defect class the shipped scripts
          # already guard against.
          PYTHONIOENCODING: utf-8
        run: |
          set -u
          rc=0
          for req in recommended-addons/*/requirements.txt; do
            echo "==== $req ===="
            if python -m pip install --dry-run --quiet --report - -r "$req" >/dev/null; then
              echo "  OK"
            else
              echo "  FAILED to resolve: $req"
              python -m pip install --dry-run -r "$req" 2>&1 | tail -20 || true
              rc=1
            fi
          done
          exit $rc

  unit-tests:
    name: unit tests (pytest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is REQUIRED here, not decorative: the addon payload
        # parity test exercises setup-memory-stack.ps1, which no other job
        # inspects (verify.sh only counts skills, it never checks payload).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: the migration suite builds a v3.6.2 fixture
          # via `git archive 59541b9` (tests/conftest.py). The default shallow
          # clone lacks that baseline commit and every migration test errors at
          # setup — do not lower this back to a shallow fetch.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit suite
        run: python -m pytest tests/ -q

  install-bash:
    name: install + verify (bash, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (default — all addons, general-edition)
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-test
        run: |
          mkdir -p "$WORKING_DIR"
          cd "$WORKING_DIR"
          bash "${{ github.workspace }}/setup-memory-stack.sh" --skip-wizard --compliance=none

      - name: Verify install
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-test
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"

  install-minimal:
    name: install --minimal (bash, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal (no addons)
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-minimal
        run: |
          mkdir -p "$WORKING_DIR"
          cd "$WORKING_DIR"
          bash "${{ github.workspace }}/setup-memory-stack.sh" --minimal --skip-wizard --compliance=none

      - name: Verify install
        env:
          WORKING_DIR: ${{ runner.temp }}/ums-minimal
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"

  install-windows:
    name: install + verify (powershell, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (PowerShell, all addons)
        shell: pwsh
        env:
          WORKING_DIR: ${{ runner.temp }}\ums-test-win
        run: |
          New-Item -ItemType Directory -Force -Path $env:WORKING_DIR | Out-Null
          Set-Location $env:WORKING_DIR
          & "$env:GITHUB_WORKSPACE\setup-memory-stack.ps1" -SkipWizard -Compliance none

      - name: Verify install (via bash since verify.sh is bash-only)
        shell: bash
        env:
          WORKING_DIR: ${{ runner.temp }}\ums-test-win
        run: |
          bash "${{ github.workspace }}/verify.sh" "$WORKING_DIR"

  # --------------------------------------------------------------------------
  # Add-on smoke tests — actually INSTALL the add-on and run its own smoke test.
  #
  # `addon-manifests` proves a manifest RESOLVES (--dry-run). Resolution is not
  # installation, and installation is not working: v4.0.0 shipped add-ons whose
  # documented procedure was impossible to follow even though every pin was
  # satisfiable. This job runs the smoke_test.py each SKILL.md tells the user to
  # run, against a real install from the hash-pinned lock.
  #
  # ⚠️ llmlingua is DELIBERATELY EXCLUDED, not overlooked. Its lock closure pulls
  # torch's full CUDA stack (nvidia-cublas, nvidia-cuda-*, ~53 packages, GBs) for
  # a test that only checks imports. `addon-manifests` already proves it resolves
  # on all 12 legs, which is the property that broke in v4.0.0. The named cost of
  # excluding it: llmlingua is the one add-on whose lock DIGESTS no CI job ever
  # verifies — the resolve job checks hash PRESENCE, not correctness (see its
  # comment). Accepted because a wrong digest fails CLOSED at user install time:
  # a loud availability break, not a silent substitution. If llmlingua ever gains
  # a runtime defect that resolution cannot catch, revisit with a CPU-only torch
  # index rather than quietly widening the matrix.
  #
  # One leg only (ubuntu/3.13): these smoke tests assert package identity and
  # backend initialisation, neither of which is OS- or interpreter-specific.
  # Platform-specific wheel availability is already covered by addon-manifests.
  # --------------------------------------------------------------------------
  addon-smoke:
    name: addon smoke tests (install + run)
    runs-on: ubuntu-latest
    # Two real installs (~60 packages) plus two smoke tests. Locally the whole
    # job is well under 5 minutes; 20 is generous headroom over a cold cache,
    # and far better than the 6-hour default if a download stalls.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: graphify — install from lock and smoke test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes \
            -r recommended-addons/graphify-installer/locks/requirements-py3.13.lock
          python recommended-addons/graphify-installer/smoke_test.py

      - name: graphiti — install from lock and smoke test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          # Standing vetting condition: telemetry OFF before first import.
          GRAPHITI_TELEMETRY_ENABLED: "false"
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes \
            -r recommended-addons/graphiti-installer/locks/requirements-py3.13.lock
          python recommended-addons/graphiti-installer/smoke_test.py
